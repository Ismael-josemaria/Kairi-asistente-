<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K.A.I.R.I. - Radar Global</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    <div class="container">
        <div class="header">
            <h1>K.A.I.R.I.</h1>
            <p>Sistemas Stark Mk IV</p>
        </div>

        <div class="clima-wrapper" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; margin-top: 40px; margin-bottom: 40px;">
            <div class="glass-panel" style="max-width: 1000px; width: 90%; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 400px; padding: 40px;">
                <h2 style="color: #00f3ff; letter-spacing: 3px; font-size: 2rem; margin-bottom: 20px;">RADAR CLIMÁTICO GLOBAL</h2>
                <div id="clima-status" style="color: #a0aec0; margin-bottom: 20px; font-size: 1.2rem;">Conectando con satélites meteorológicos...</div>
                
                <div id="clima-data" style="display: none; width: 100%;">
                    <div style="font-size: 1.5rem; color: #fff; margin-bottom: 20px; text-shadow: 0 0 10px #00f3ff;" id="clima-location">UBICACIÓN</div>
                    
                    <!-- DATOS LOCALES -->
                    <div style="display: flex; justify-content: center; gap: 20px; width: 100%; margin-bottom: 30px; flex-wrap: wrap;">
                        <div class="glass-panel" style="flex: 1; min-width: 200px; max-width: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;">
                            <div class="widget-title">🌡️ TEMPERATURA NÚCLEO</div>
                            <div class="widget-value" id="clima-temp" style="font-size: 2.5rem; text-shadow: 0 0 15px #00f3ff;">-- °C</div>
                        </div>
                        <div class="glass-panel" style="flex: 1; min-width: 200px; max-width: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;">
                            <div class="widget-title">💨 CORRIENTES DE VIENTO</div>
                            <div class="widget-value" id="clima-wind" style="font-size: 2.5rem; text-shadow: 0 0 15px #00f3ff;">-- km/h</div>
                        </div>
                        <div class="glass-panel" style="flex: 1; min-width: 200px; max-width: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;">
                            <div class="widget-title">💧 HUMEDAD RELATIVA</div>
                            <div class="widget-value" id="clima-humidity" style="font-size: 2.5rem; text-shadow: 0 0 15px #00f3ff;">-- %</div>
                        </div>
                        <div class="glass-panel" style="flex: 1; min-width: 200px; max-width: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;">
                            <div class="widget-title">🔥 SENSACIÓN TÉRMICA</div>
                            <div class="widget-value" id="clima-apparent" style="font-size: 2.5rem; text-shadow: 0 0 15px #00f3ff;">-- °C</div>
                        </div>
                    </div>

                    <!-- MAPA RADAR GLOBAL -->
                    <h3 style="color: #a0aec0; letter-spacing: 2px; font-size: 1.2rem; margin-bottom: 15px; border-bottom: 1px solid rgba(0, 243, 255, 0.3); padding-bottom: 10px; text-align: left;">SISTEMA DE RASTREO SATELITAL (WINDY)</h3>
                    <div id="radar-container" style="width: 100%; height: 500px; border-radius: 10px; overflow: hidden; border: 1px solid rgba(0, 243, 255, 0.3); box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);">
                        <iframe id="windy-iframe" width="100%" height="100%" src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=default&metricTemp=default&metricWind=default&zoom=3&overlay=wind&product=ecmwf&level=surface" frameborder="0"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- BOTTOM NAV BAR (MOBILE ONLY) -->
    <div class="bottom-nav-bar">
        <button class="bottom-nav-btn" onclick="window.location.href='index.html'">
            <span style="font-size: 1.5rem;">🏠</span>
            Inicio
        </button>
        <button class="bottom-nav-btn active" onclick="window.location.href='clima.html'">
            <span style="font-size: 1.5rem;">⛅</span>
            Clima
        </button>
        <button class="bottom-nav-btn" onclick="window.location.href='tareas.html'">
            <span style="font-size: 1.5rem;">✓</span>
            Tareas
        </button>
        <button class="bottom-nav-btn" onclick="window.location.href='focus.html'">
            <span style="font-size: 1.5rem;">🧠</span>
            Foco
        </button>
    </div>

    <script src="nav.js"></script>
    <script src="clima.js"></script>
    <script>
        const canvas = document.getElementById('particles-canvas');
        if (canvas && window.innerWidth > 768) {
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            for(let i=0; i<50; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 2, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 243, 255, ${Math.random() * 0.5})`;
                ctx.fill();
            }
        }
    </script>
</body>
</html>
